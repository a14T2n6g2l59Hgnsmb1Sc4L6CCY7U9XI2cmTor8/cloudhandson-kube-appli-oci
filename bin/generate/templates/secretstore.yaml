apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ${APPLICATION_NAME}
  namespace: ${APPLICATION_NAMESPACE}
spec:
  provider:
    aws:
      service: ParameterStore
#      role: arn:aws:iam::${AWS_ACCOUNT_ID}:role/EKS_${CLUSTER_ENV}_${CLUSTER_NAME}_${APPLICATION_NAMESPACE}_externalSecrets_role
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: ${APPLICATION_NAMESPACE}-external-secret
